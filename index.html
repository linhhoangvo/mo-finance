<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Mô Finance</title>
  <meta name="description" content="Mô Finance — quản trị tài chính danh mục bất động sản." />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">M</div>
        <div><strong>Mô Finance</strong><small>Property finance</small></div>
      </div>
      <nav id="nav">
        <button class="nav-item active" data-view="dashboard">Dashboard</button>
        <button class="nav-item" data-view="properties">Properties</button>
        <button class="nav-item" data-view="transactions">Transactions</button>
        <button class="nav-item" data-view="loans">Loans</button>
        <button class="nav-item" data-view="rentals">Rentals</button>
        <button class="nav-item" data-view="sales">Sales</button>
        <button class="nav-item" data-view="reports">Reports</button>
      </nav>
      <div class="sidebar-footer"><small>V3 · Loan allocation</small></div>
    </aside>

    <main>
      <header class="topbar">
        <div><p class="eyebrow">PORTFOLIO</p><h1 id="pageTitle">Dashboard</h1></div>
        <button class="primary" id="addTransactionBtn">+ Add transaction</button>
      </header>

      <section id="dashboard" class="view active"></section>
      <section id="properties" class="view"></section>
      <section id="transactions" class="view"></section>
      <section id="loans" class="view"></section>
      <section id="rentals" class="view"></section>
      <section id="sales" class="view"></section>
      <section id="reports" class="view"></section>
    </main>
  </div>

  <dialog id="propertyDialog" class="wide-dialog">
    <div id="propertyDetail"></div>
  </dialog>

  <dialog id="transactionDialog">
    <form method="dialog" id="transactionForm">
      <div class="dialog-head">
        <div><p class="eyebrow">NEW ENTRY</p><h2>Add transaction</h2></div>
        <button class="icon-btn" value="cancel" aria-label="Close">×</button>
      </div>
      <div class="form-grid">
        <label>Date<input id="txDate" type="date" required></label>
        <label>Property<select id="txProperty" required></select></label>
        <label>Type<select id="txType" required>
          <option>Expense</option><option>Income</option><option>Capital Contribution</option>
          <option>Loan In</option><option>Loan Repayment</option><option>Transfer</option>
        </select></label>
        <label>Category<input id="txCategory" placeholder="Renovation, Legal, Rent..." required></label>
        <label class="span-2">Description<input id="txDescription" placeholder="Nội dung giao dịch" required></label>
        <label>Amount (VND)<input id="txAmount" inputmode="numeric" type="number" min="0" step="1000" required></label>
        <label>Source / Paid by<input id="txSource" placeholder="Owner, Bank, Supplier..."></label>
      </div>
      <div class="dialog-actions">
        <button class="ghost" value="cancel">Cancel</button>
        <button class="primary" id="saveTransaction" value="default">Save transaction</button>
      </div>
    </form>
  </dialog>

  <dialog id="loanAllocationDialog">
    <div style="padding:22px">
      <div class="dialog-head"><div><p class="eyebrow">DEBT ALLOCATION</p><h2 id="allocationTitle">Allocate loan</h2><p id="allocationSummary"></p></div><button class="icon-btn" type="button" onclick="document.querySelector('#loanAllocationDialog').close()" aria-label="Close">×</button></div>
      <div id="allocationRows" class="breakdown"></div>
      <form id="allocationForm">
        <div class="form-grid">
          <label>Property<select id="allocationProperty" required></select></label>
          <label>Allocate amount (VND)<input id="allocationAmount" type="number" min="1" step="1" required></label>
        </div>
        <p id="allocationError" role="alert" style="color:#a5493f"></p>
        <div class="dialog-actions"><button type="button" class="ghost" onclick="document.querySelector('#loanAllocationDialog').close()">Done</button><button class="primary" type="submit">Add allocation</button></div>
      </form>
    </div>
  </dialog>
  <script src="app.js"></script>
</body>
</html>
